<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow, noarchive"/>
  <title>VaultGG — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Russo+One&display=swap"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
  :root{--bg:#080816;--surface:#10102a;--card:rgba(16,16,42,.95);--border:rgba(255,255,255,.07);--border-md:rgba(255,255,255,.13);--violet:#7C3AED;--violet-lt:#A78BFA;--rose:#F43F5E;--rose-lt:#FB7185;--green:#10B981;--text:#E2E8F0;--muted:#64748B;--muted-lt:#94A3B8;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{background:var(--bg);color:var(--text);}
  body{font-family:'Chakra Petch',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);background-image:radial-gradient(ellipse 800px 600px at 20% 50%,rgba(124,58,237,.09) 0%,transparent 60%),radial-gradient(ellipse 600px 400px at 80% 20%,rgba(244,63,94,.06) 0%,transparent 60%);}
  h1,h2{font-family:'Russo One',sans-serif;letter-spacing:.02em;}
  ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--violet);border-radius:4px;}

  /* NAV */
  .nav{background:rgba(8,8,22,.9);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:0 24px;height:64px;display:flex;align-items:center;}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--violet),var(--rose));display:flex;align-items:center;justify-content:center;}
  .logo-text{font-family:'Russo One',sans-serif;font-size:20px;background:linear-gradient(135deg,#fff 40%,var(--violet-lt));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .logo-text span{background:linear-gradient(135deg,var(--violet-lt),var(--rose));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

  /* MAIN */
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;}
  .auth-card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border-md);border-radius:24px;padding:40px;opacity:0;transform:translateY(30px);}
  .auth-logo{text-align:center;margin-bottom:8px;}
  .auth-title{font-size:28px;text-align:center;margin-bottom:8px;}
  .auth-sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:32px;}
  .auth-sub a{color:var(--violet-lt);text-decoration:none;}
  .auth-sub a:hover{text-decoration:underline;}

  /* Social login */
  .social-btns{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;}
  .social-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--border-md);background:rgba(255,255,255,.04);color:var(--text);font-family:'Chakra Petch',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;text-decoration:none;}
  .social-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(167,139,250,.3);}

  .divider{display:flex;align-items:center;gap:12px;margin-bottom:28px;color:var(--muted);font-size:12px;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}

  /* Form */
  .field{margin-bottom:18px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted-lt);margin-bottom:8px;letter-spacing:.04em;text-transform:uppercase;}
  .input-wrap{position:relative;}
  input[type=email],input[type=password],input[type=text]{
    width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border-md);
    border-radius:12px;padding:13px 16px;color:var(--text);
    font-family:'Chakra Petch',sans-serif;font-size:14px;outline:none;
    transition:.25s;
  }
  input::placeholder{color:var(--muted);}
  input:focus{border-color:rgba(167,139,250,.6);background:rgba(124,58,237,.05);box-shadow:0 0 0 3px rgba(124,58,237,.12);}

  .field-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .field-row label{margin-bottom:0;}
  .forgot{font-size:12px;color:var(--violet-lt);text-decoration:none;}
  .forgot:hover{text-decoration:underline;}

  .show-pwd{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:none;border-radius:12px;font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:15px;cursor:pointer;transition:.25s;text-decoration:none;}
  .btn-primary{background:linear-gradient(135deg,var(--violet),var(--rose));color:#fff;font-family:'Russo One',sans-serif;letter-spacing:.04em;box-shadow:0 0 24px rgba(124,58,237,.4);}
  .btn-primary:hover{box-shadow:0 0 40px rgba(124,58,237,.65);transform:translateY(-2px);}

  .terms{text-align:center;font-size:11px;color:var(--muted);margin-top:20px;line-height:1.6;}
  .terms a{color:var(--violet-lt);text-decoration:none;}

  /* Error */
  .field-error{font-size:11px;color:var(--rose);margin-top:6px;display:none;}
  input.error{border-color:rgba(244,63,94,.5);}
  input.error + .show-pwd + .field-error, .field-error.visible{display:block;}

  footer{padding:24px;text-align:center;font-size:11px;color:var(--muted);}
  </style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="logo">
    <div class="logo-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
    <span class="logo-text">Vault<span>GG</span></span>
  </a>
</nav>

<main>
  <div class="auth-card" id="auth-card">
    <div class="auth-logo">
      <div style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--violet),var(--rose));display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 0 30px rgba(124,58,237,.4);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
    </div>
    <h1 class="auth-title">Bon retour !</h1>
    <p class="auth-sub">Pas encore de compte ? <a href="register.html">S'inscrire gratuitement</a></p>

    <div class="social-btns">
      <button class="social-btn" onclick="socialLogin('Discord')">
        <svg width="18" height="18" fill="#5865F2" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057.1 18.079.11 18.1.12 18.12a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
        Continuer avec Discord
      </button>
      <button class="social-btn" onclick="socialLogin('Google')">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continuer avec Google
      </button>
    </div>

    <div class="divider">ou avec votre email</div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="email">Adresse email</label>
        <input type="email" id="email" placeholder="votre@email.com" required autocomplete="email"/>
        <p class="field-error" id="email-error">Email invalide</p>
      </div>

      <div class="field">
        <div class="field-row">
          <label for="password">Mot de passe</label>
          <a href="#" class="forgot">Mot de passe oublié ?</a>
        </div>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password"/>
          <button type="button" class="show-pwd" onclick="togglePwd('password')" aria-label="Afficher/masquer">
            <svg id="pwd-eye" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="field-error" id="pwd-error">Mot de passe incorrect</p>
      </div>

      <button type="submit" class="btn btn-primary" id="login-btn">
        Se connecter
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <p class="terms">En vous connectant, vous acceptez nos <a href="#">CGU</a> et notre <a href="#">Politique de confidentialité</a>.</p>
  </div>
</main>

<footer>© 2024 VaultGG — Plateforme sécurisée SSL 256-bit</footer>

<script>
if(typeof gsap!=='undefined'){
  gsap.to('#auth-card',{opacity:1,y:0,duration:.8,ease:'power3.out'});
}else{
  document.getElementById('auth-card').style.opacity='1';
  document.getElementById('auth-card').style.transform='none';
}

function togglePwd(id){
  const input=document.getElementById(id);
  input.type=input.type==='password'?'text':'password';
}

function socialLogin(provider){
  const btn=event.currentTarget;
  btn.textContent='Connexion en cours...';
  btn.disabled=true;
  setTimeout(()=>{location.href='index.html';},1500);
}

function handleLogin(e){
  e.preventDefault();
  const email=document.getElementById('email').value;
  const pwd=document.getElementById('password').value;
  const btn=document.getElementById('login-btn');

  btn.textContent='Connexion en cours...';
  btn.disabled=true;
  btn.style.opacity='.7';

  setTimeout(()=>{
    /* Demo: any email+password works */
    if(email&&pwd.length>=6){
      localStorage.setItem('vault_user',JSON.stringify({email,logged:true}));
      location.href='index.html';
    }else{
      btn.textContent='Se connecter';
      btn.disabled=false;
      btn.style.opacity='1';
      const errEl=document.getElementById('pwd-error');
      errEl.textContent='Minimum 6 caractères requis';
      errEl.classList.add('visible');
      document.getElementById('password').classList.add('error');
    }
  },900);
}
</script>
</body>
</html>
